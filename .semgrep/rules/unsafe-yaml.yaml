# .semgrep/rules/unsafe-yaml.yaml
rules:
  - id: unsafe-yaml
    languages: [python]
    severity: ERROR
    message: >-
      yaml.load without SafeLoader can construct arbitrary Python objects.
      Use yaml.safe_load, or pass Loader=yaml.SafeLoader (or CSafeLoader).
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: yaml.load(...)
              - pattern: yaml.load_all(...)
          - pattern-not: yaml.$LOAD($DATA, Loader=yaml.SafeLoader)
          - pattern-not: yaml.$LOAD($DATA, Loader=yaml.CSafeLoader)
          - pattern-not: yaml.$LOAD($DATA, yaml.SafeLoader)
          - pattern-not: yaml.$LOAD($DATA, yaml.CSafeLoader)
      - pattern: yaml.full_load(...)
      - pattern: yaml.full_load_all(...)
      - pattern: yaml.unsafe_load(...)
      - pattern: yaml.unsafe_load_all(...)
