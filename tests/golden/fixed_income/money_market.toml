[[sources]]
key = "zero_discount"
kind = "identity"
citation = "At a discount rate of zero, P = F (1 - d t / 360) is the face value."

[[sources]]
key = "yield_definitions"
kind = "identity"
citation = "The money-market yield is (F - P) / P x 360 / t; the effective annual yield is (F / P)^(365 / t) - 1; the holding-period yield is (P1 - P0 + D) / P0."

[[cases]]
id = "price_from_discount_rate"
source = "cfr356b"
locator = "Section VI.A, example (bill issued November 24, 1989, due February 22, 1990, at 7.610%)"
edge = false
inputs = { calculation = "price_from_discount", discount_rate = 0.0761, days = 90 }
expected = { price = 98.0975, discount = 1.9025 }
tolerance = { price = { abs = 5e-7 }, discount = { abs = 5e-7 } }
note = "Published as 98.097500 per 100."

