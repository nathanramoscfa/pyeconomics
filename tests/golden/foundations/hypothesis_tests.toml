url = "https://www.itl.nist.gov/div898/handbook/eda/section3/eda352.htm"

[[sources]]
key = "nist_two_sample"
kind = "official"
citation = "NIST/SEMATECH (2012). e-Handbook of Statistical Methods, section 1.3.5.3, Two-Sample t-Test for Equal Means."
url = "https://www.itl.nist.gov/div898/handbook/eda/section3/eda353.htm"

[[sources]]
key = "nist_chi_square"
kind = "official"
citation = "NIST/SEMATECH (2012). e-Handbook of Statistical Methods, section 1.3.5.8, Chi-Square Test for the Variance."
url = "https://www.itl.nist.gov/div898/handbook/eda/section3/eda358.htm"

[[sources]]
key = "nist_f"
kind = "official"
