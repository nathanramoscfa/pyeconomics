# .readthedocs.yaml
# Only main's non-default 1.0 preview uses this file; legacy uses .yml.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    post_create_environment:
      - pip install uv==0.12.15
    post_install:
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --locked --group docs --all-extras

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
